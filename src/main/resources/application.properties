spring.application.name=reconciliation-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/reconciliation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092

# Websites (browser apps) allowed to call this API — the React dev server
app.cors.allowed-origins=http://localhost:5173

spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Safety wrapper: if a message is not valid JSON, don't crash-loop; hand the error to the error handler (→ DLT)
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.payrecon.reconciliation.event.PaymentCreatedEvent
# --- JWT check (LOCAL DEV DEFAULT ONLY): must be the SAME secret as payment-service ---
app.security.jwt-secret=${JWT_SECRET:local-dev-only-secret-change-me-0123456789}

# --- Spring AI / OpenAI (step 7) ---
# The key comes ONLY from the OPENAI_API_KEY environment variable — never write it in this file.
# Without it, explanations fall back to simple rules (the app still works).
spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.timeout=20s
# Fail fast: don't keep the user waiting through many retries
spring.ai.retry.max-attempts=2
